services:
  postgres:
    container_name: arcus-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arcus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcus}
      POSTGRES_DB: ${POSTGRES_DB:-arcus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - arcus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcus} -d ${POSTGRES_DB:-arcus}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arcus_postgres_data:
