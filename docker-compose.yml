services:
  postgres:
    container_name: arcus-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arcus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcus}
      POSTGRES_DB: ${POSTGRES_DB:-arcus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - arcus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcus} -d ${POSTGRES_DB:-arcus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - apps/api/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  dragonfly:
    container_name: dragonfly
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: --proactor_threads=2 --default_lua_flags=allow-undeclared-keys
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arcus_postgres_data:
  minio_data:
